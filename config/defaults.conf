# Linux Server Hardening defaults
# Override in config/local.conf (not committed) or via environment variables.

BACKUP_ROOT=${BACKUP_ROOT:-/etc/server-hardening/backups}
REPORT_ROOT=${REPORT_ROOT:-/var/log/server-hardening}
LOCK_FILE=${LOCK_FILE:-/run/lock/server-hardening.lock}

ADMIN_USER=${ADMIN_USER:-}
ADMIN_SSH_PUBLIC_KEY=${ADMIN_SSH_PUBLIC_KEY:-}
ADD_ADMIN_TO_DOCKER_GROUP=${ADD_ADMIN_TO_DOCKER_GROUP:-yes}
ROLLBACK_REMOVE_CREATED_USERS=${ROLLBACK_REMOVE_CREATED_USERS:-no}
ROLLBACK_REMOVE_INSTALLED_PACKAGES=${ROLLBACK_REMOVE_INSTALLED_PACKAGES:-no}

SSH_PORT=${SSH_PORT:-2255}
SSH_PASSWORD_AUTH=${SSH_PASSWORD_AUTH:-no}
SSH_ROOT_LOGIN=${SSH_ROOT_LOGIN:-no}
SSH_MAX_AUTH_TRIES=${SSH_MAX_AUTH_TRIES:-3}
SSH_LOGIN_GRACE_TIME=${SSH_LOGIN_GRACE_TIME:-30}
SSH_CLIENT_ALIVE_INTERVAL=${SSH_CLIENT_ALIVE_INTERVAL:-300}
SSH_CLIENT_ALIVE_COUNT_MAX=${SSH_CLIENT_ALIVE_COUNT_MAX:-2}

LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-180}
JOURNAL_SYSTEM_MAX_USE=${JOURNAL_SYSTEM_MAX_USE:-8G}
JOURNAL_SYSTEM_KEEP_FREE=${JOURNAL_SYSTEM_KEEP_FREE:-10G}
JOURNAL_SYSTEM_MAX_FILE_SIZE=${JOURNAL_SYSTEM_MAX_FILE_SIZE:-128M}
JOURNAL_RUNTIME_MAX_USE=${JOURNAL_RUNTIME_MAX_USE:-1G}
RSYSLOG_ROTATE_DAYS=${RSYSLOG_ROTATE_DAYS:-14}
RSYSLOG_MAX_SIZE=${RSYSLOG_MAX_SIZE:-250M}
MANAGE_RSYSLOG_ROTATION=${MANAGE_RSYSLOG_ROTATION:-yes}

AUDIT_MAX_LOG_FILE_MB=${AUDIT_MAX_LOG_FILE_MB:-100}
AUDIT_NUM_LOGS=${AUDIT_NUM_LOGS:-20}
AUDIT_SPACE_LEFT=${AUDIT_SPACE_LEFT:-10%}
AUDIT_ADMIN_SPACE_LEFT=${AUDIT_ADMIN_SPACE_LEFT:-5%}
AUDIT_SPACE_LEFT_ACTION=${AUDIT_SPACE_LEFT_ACTION:-SYSLOG}
AUDIT_ADMIN_SPACE_LEFT_ACTION=${AUDIT_ADMIN_SPACE_LEFT_ACTION:-SUSPEND}
AUDIT_DISK_FULL_ACTION=${AUDIT_DISK_FULL_ACTION:-SUSPEND}
AUDIT_DISK_ERROR_ACTION=${AUDIT_DISK_ERROR_ACTION:-SUSPEND}

ENABLE_FAIL2BAN=${ENABLE_FAIL2BAN:-yes}
ENABLE_ETCKEEPER=${ENABLE_ETCKEEPER:-yes}
ALLOW_REPO_ENABLE=${ALLOW_REPO_ENABLE:-no}

SELINUX_TARGET_MODE=${SELINUX_TARGET_MODE:-enforcing}
SELINUX_UPDATE_POLICY=${SELINUX_UPDATE_POLICY:-yes}
SELINUX_AUTO_ENFORCE=${SELINUX_AUTO_ENFORCE:-no}

DOCKER_MANAGE_LOGGING=${DOCKER_MANAGE_LOGGING:-yes}
DOCKER_DAEMON_JSON=${DOCKER_DAEMON_JSON:-/etc/docker/daemon.json}
DOCKER_LOG_DRIVER=${DOCKER_LOG_DRIVER:-json-file}
DOCKER_LOG_MAX_SIZE=${DOCKER_LOG_MAX_SIZE:-100m}
DOCKER_LOG_MAX_FILE=${DOCKER_LOG_MAX_FILE:-5}
DOCKER_LOG_COMPRESS=${DOCKER_LOG_COMPRESS:-true}
DOCKER_FORCE_LOG_DRIVER=${DOCKER_FORCE_LOG_DRIVER:-no}
DOCKER_RESTART_ON_APPLY=${DOCKER_RESTART_ON_APPLY:-auto}

LOCALE_NAME=${LOCALE_NAME:-en_US.UTF-8}

FIREWALL_MANAGEMENT=${FIREWALL_MANAGEMENT:-external}
